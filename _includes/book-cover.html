{% assign cb = include.book | default: book %}{% assign cnum = 0 %}{% for b in site.data.books %}{% if b.id == cb.id %}{% assign cnum = forloop.index %}{% endif %}{% endfor %}<div class="book-cover {% if include.small %}small-cover{% endif %}" style="--cover-art:url('{{ cb.cover_art | relative_url }}')" aria-label="Cover of {{ cb.title }} by {{ cb.author }}" role="img"><div class="cover-imprint">THE VOID <span>№ {{ cnum | prepend: '00' | slice: -3, 3 }}</span></div><div class="cover-title">{{ cb.cover_title }}</div><div class="cover-author">{{ cb.author | upcase }}</div><div class="cover-bottom">{{ cb.cover_label }}</div></div>
